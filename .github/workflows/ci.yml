name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # Core は OS 非依存であることを Windows 以外のランナーで確認する
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build Core tests
        run: dotnet build tests/ClipFlow.Core.Tests -c Release -warnaserror
      - name: Test Core
        run: dotnet test tests/ClipFlow.Core.Tests -c Release --no-build --logger "trx;LogFileName=core-linux.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-linux
          path: TestResults

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore ClipFlow.sln
      - name: Build
        run: dotnet build ClipFlow.sln -c Release -warnaserror --no-restore
      - name: Test
        run: dotnet test ClipFlow.sln -c Release --no-build --logger "trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: TestResults
      - name: Publish (self-contained win-x64)
        run: dotnet publish src/ClipFlow.App/ClipFlow.App.csproj -c Release -r win-x64 --self-contained true -warnaserror -o publish/ClipFlow-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: ClipFlow-win-x64
          path: publish/ClipFlow-win-x64
          if-no-files-found: error
